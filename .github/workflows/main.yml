name: nightly-build-gcc

on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (workspace for objdir)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            flex bison texinfo gawk pkg-config libz-dev \
            ca-certificates curl gcc-multilib g++-multilib

      - name: Clone or update gcc mirror (full clone)
        run: |
          set -eux
          REPO=https://github.com/gcc-mirror/gcc
          git clone "$REPO"

      - name: Configure in objdir (out-of-source; no options)
        run: |
          set -eux
          mkdir -p objdir
          cd objdir
          ../gcc/configure

      - name: Build
        run: |
          set -eux
          cd objdir
          JOBS=$(nproc || echo 2)
          make -j"${JOBS}"

      - name: Upload objdir as artifact (保存构建产物)
        uses: actions/upload-artifact@v7
        with:
          name: gcc-objdir
          path: objdir
