name: nightly-build-gcc

on:
  schedule:
    # 每小时触发；在 job 内按 America/New_York 检查是否为 00:00
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo (workspace for objdir)
        uses: actions/checkout@v4

      - name: Only run at 00:00 America/New_York (ET)
        id: et-check
        run: |
          hour=$(TZ=America/New_York date +%H)
          echo "Current hour in America/New_York: $hour"
          if [ "$hour" != "00" ]; then
            echo "Not midnight ET — exiting job early."
            exit 0
          fi
          echo "It's 00:00 ET — proceeding."

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            flex bison texinfo gawk pkg-config libz-dev \
            ca-certificates curl

      - name: Clone or update gcc mirror (full clone)
        run: |
          set -eux
          REPO=https://github.com/gcc-mirror/gcc
          DEST=gcc-src

          if [ -d "$DEST" ]; then
            if [ -d "$DEST/.git" ]; then
              echo "Directory $DEST exists and is a git repo — pulling latest changes"
              git -C "$DEST" fetch --all
              git -C "$DEST" pull --ff-only || git -C "$DEST" pull
            else
              echo "$DEST exists but is not a git repo — removing and cloning afresh"
              rm -rf "$DEST"
              git clone "$REPO" "$DEST"
            fi
          else
            echo "Cloning full repository $REPO into $DEST"
            git clone "$REPO" "$DEST"
          fi

      - name: Configure in objdir (out-of-source; no options)
        run: |
          set -eux
          mkdir -p objdir
          cd objdir
          ../gcc-src/configure

      - name: Build (no make clean)
        run: |
          set -eux
          cd objdir
          JOBS=$(nproc || echo 2)
          make -j"${JOBS}"

      - name: Upload objdir as artifact (保存构建产物)
        uses: actions/upload-artifact@v4
        with:
          name: gcc-objdir
          path: objdir
